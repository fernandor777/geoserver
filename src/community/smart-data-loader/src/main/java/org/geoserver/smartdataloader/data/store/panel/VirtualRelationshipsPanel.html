<html xmlns:wicket="http://wicket.apache.org/">
<body>
<wicket:panel>
  <div class="virtual-relationships-panel">
    <h3><wicket:message key="VirtualRelationshipsPanel.title">Virtual relationships</wicket:message></h3>
    <div wicket:id="feedback"></div>

    <div wicket:id="emptyContainer" class="virtual-relationships-empty">
      <wicket:message key="VirtualRelationshipsPanel.empty">No virtual relationships defined.</wicket:message>
    </div>

    <table wicket:id="relationshipsTable" class="virtual-relationships-table">
      <thead>
        <tr>
          <th><wicket:message key="VirtualRelationshipsPanel.name">Name</wicket:message></th>
          <th><wicket:message key="VirtualRelationshipsPanel.cardinality">Cardinality</wicket:message></th>
          <th><wicket:message key="VirtualRelationshipsPanel.source">Source</wicket:message></th>
          <th><wicket:message key="VirtualRelationshipsPanel.target">Target</wicket:message></th>
          <th class="virtual-relationships-actions"><wicket:message key="VirtualRelationshipsPanel.actions">Actions</wicket:message></th>
        </tr>
      </thead>
      <tbody wicket:id="relationships">
        <tr>
          <td><span wicket:id="name"></span></td>
          <td><span wicket:id="cardinality"></span></td>
          <td><span wicket:id="source"></span></td>
          <td><span wicket:id="target"></span></td>
          <td class="virtual-relationships-actions">
            <a href="#" wicket:id="edit"><wicket:message key="VirtualRelationshipsPanel.edit">Edit</wicket:message></a>
            <a href="#" wicket:id="remove" class="remove-link"><wicket:message key="VirtualRelationshipsPanel.remove">Remove</wicket:message></a>
          </td>
        </tr>
      </tbody>
    </table>

    <form wicket:id="relationshipForm" class="virtual-relationships-form">
      <fieldset>
        <legend wicket:id="formLegend">Add virtual relationship</legend>
        <div class="form-row">
          <label><wicket:message key="VirtualRelationshipsPanel.name">Name</wicket:message></label>
          <input type="text" wicket:id="name"/>
        </div>
        <div class="form-row">
          <label><wicket:message key="VirtualRelationshipsPanel.cardinality">Cardinality</wicket:message></label>
          <select wicket:id="cardinality"></select>
        </div>
        <div class="form-row form-grouped">
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.sourceSchema">Source schema</wicket:message></label>
            <input type="text" wicket:id="sourceSchema"/>
          </div>
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.sourceEntity">Source entity</wicket:message></label>
            <input type="text" wicket:id="sourceEntity"/>
          </div>
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.sourceKind">Source kind</wicket:message></label>
            <select wicket:id="sourceKind"></select>
          </div>
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.sourceColumn">Source column</wicket:message></label>
            <input type="text" wicket:id="sourceColumn"/>
          </div>
        </div>
        <div class="form-row form-grouped">
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.targetSchema">Target schema</wicket:message></label>
            <input type="text" wicket:id="targetSchema"/>
          </div>
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.targetEntity">Target entity</wicket:message></label>
            <input type="text" wicket:id="targetEntity"/>
          </div>
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.targetKind">Target kind</wicket:message></label>
            <select wicket:id="targetKind"></select>
          </div>
          <div>
            <label><wicket:message key="VirtualRelationshipsPanel.targetColumn">Target column</wicket:message></label>
            <input type="text" wicket:id="targetColumn"/>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" wicket:id="save"><wicket:message key="VirtualRelationshipsPanel.save">Save</wicket:message></button>
          <button type="button" wicket:id="cancel"><wicket:message key="VirtualRelationshipsPanel.cancel">Cancel</wicket:message></button>
        </div>
      </fieldset>
    </form>
  </div>
</wicket:panel>
</body>
</html>
